# Turn on order events for kite-connect-mcp.service (docs/EVENTS.md): postbacks as a doorbell, the order-book poll,
# the event store and the consumers. Walkthrough: docs/SELF_HOSTING.md, "Order events on a server".
#
# Only the settings that need the service are here. KITE_MCP_EVENTS=true needs the HTTP transport, which the unit's
# command line (--transport http) gives the service; in the settings file it would stop every kite-mcp-ctl command,
# which runs without it. The postback route is served by the service alone. Every other events setting goes in the
# settings file, /etc/kite-connect-mcp/kite-connect-mcp.env, which the service and the commands both read, so that
# `events status` finds the store and the consumers' names, and shows the service's own poll settings:
#
#   KITE_MCP_EVENTS_DB=/var/lib/kite-connect-mcp/events.sqlite3
#   KITE_MCP_EVENTS_CONSUMERS_FILE=/etc/kite-connect-mcp/consumers.json
#
# A line for the same setting in the settings file wins over the ones here (systemd reads EnvironmentFile= last), so
# keep each setting in one place.
#
# The consumers file must be readable by the service user. It and every consumer program must belong to that user
# (kite-mcp) or root, and only their owner may be able to change them or the folders on the way to them. The service
# refuses to start otherwise, or when the file is missing (leave the KITE_MCP_EVENTS_CONSUMERS_FILE line out to record
# events without consumers). Create the file as the service user's, then write it (examples/events.consumers.json
# shows the format):
#
#   sudo install -m 0600 -o kite-mcp -g kite-mcp /dev/null /etc/kite-connect-mcp/consumers.json
#   sudoedit /etc/kite-connect-mcp/consumers.json
#
# The service does not check a script given as an argument (python3 /path/to/script.py), so give it the same owner
# and modes yourself.
#
# The consumers run as the service user, inside the unit's sandbox:
#   - ProtectHome=true hides /home: keep the programs and their scripts elsewhere, /opt say. A program under /home
#     stops the service from starting, and a script under /home fails every delivery.
#   - ProtectSystem=strict leaves only the state and cache folders writable. A consumer that writes elsewhere needs a
#     folder of its own: the LogsDirectory= lines below make one.
#   - Their settings go in the settings file and their env_pass list, never in KITE_* variables.
# A consumer still running when the service stops or restarts is stopped with it and retried after the restart (a
# consumer killed by a signal is retried), so the default KillMode= is fine.
#
# Install it, then check. kite-mcp-ctl is the wrapper of docs/SELF_HOSTING.md (the program as kite-mcp, with the
# settings file). A selftest through the public URL proves the proxy's route as well as the server:
#
#   sudo mkdir -p /etc/systemd/system/kite-connect-mcp.service.d
#   sudo cp deploy/systemd/kite-connect-mcp.service.d/events.conf /etc/systemd/system/kite-connect-mcp.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart kite-connect-mcp
#   kite-mcp-ctl events status
#   kite-mcp-ctl events selftest --url https://kite.example.com/postback
#   kite-mcp-ctl events selftest --url http://127.0.0.1:8765/postback      # the server alone, without the proxy

[Service]
Environment=KITE_MCP_EVENTS=true
Environment=KITE_MCP_POSTBACK_PATH=/postback
# the poll and the router run all day: restart even after a clean exit
Restart=always
# A folder for examples/consumers/log_to_file.py with EVENT_LOG_FILE=/var/log/kite-events/events.jsonl in the settings
# file (its default, ~/kite-events.jsonl, is in the state folder, which is writable already). systemd creates the
# folder, owned by kite-mcp and writable inside the sandbox.
# LogsDirectory=kite-events
# LogsDirectoryMode=0700
