# Turn on order events for kite-connect-mcp.service (docs/EVENTS.md): postbacks as a doorbell, the order-book poll,
# the event store and the consumers in /etc/kite-connect-mcp/consumers.json.
#
#   sudo mkdir -p /etc/systemd/system/kite-connect-mcp.service.d
#   sudo cp deploy/systemd/kite-connect-mcp.service.d/events.conf /etc/systemd/system/kite-connect-mcp.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart kite-connect-mcp
#
# Write the consumers file first (examples/events.consumers.json shows the format), or delete the
# KITE_MCP_EVENTS_CONSUMERS_FILE line below to record events without consumers. The consumers file and every
# consumer program must belong to the service user (kite-mcp) or root, and only their owner may be able to change
# them or the folders on the way to them: the service refuses to start otherwise. The service does not check a
# script given as an argument (python3 /path/to/script.py), so keep it the same way.
#
# The consumers run as the service user, inside this unit's sandbox: a consumer that writes files needs its folder in
# ReadWritePaths= (and the folder must exist), and its settings go in the settings file and its env_pass list (never
# KITE_* variables). A consumer still running when the service stops or restarts is stopped with it and retried after
# the restart (a consumer killed by a signal is retried), so the default KillMode= is fine.
#
# These settings reach only the service, not a command you run with the settings file. Such a command reads the
# service's store by its path, and a selftest needs the postback URL:
#
#   sudo -u kite-mcp env KITE_MCP_EVENTS_DB=/var/lib/kite-connect-mcp/events.sqlite3 \
#       KITE_MCP_EVENTS_CONSUMERS_FILE=/etc/kite-connect-mcp/consumers.json \
#       /opt/kite-connect-mcp/venv/bin/kite-connect-mcp --env-file /etc/kite-connect-mcp/kite-connect-mcp.env \
#       events status
#   sudo -u kite-mcp /opt/kite-connect-mcp/venv/bin/kite-connect-mcp \
#       --env-file /etc/kite-connect-mcp/kite-connect-mcp.env events selftest --url http://127.0.0.1:8765/postback

[Service]
Environment=KITE_MCP_EVENTS=true
Environment=KITE_MCP_POSTBACK_PATH=/postback
Environment=KITE_MCP_EVENTS_CONSUMERS_FILE=/etc/kite-connect-mcp/consumers.json
# the poll and the router run all day: restart even after a clean exit
Restart=always
# a folder a consumer writes, added to the unit's ReadWritePaths= (for example for examples/consumers/log_to_file.py)
# ReadWritePaths=/var/log/kite-events
